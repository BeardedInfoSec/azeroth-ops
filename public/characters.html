<!doctype html><html><head><meta charset="utf-8"><title>Character import gallery</title><style>body{margin:0;background:#111921;color:white;font-family:Segoe UI}h1{margin:15px 30px;font-size:22px}#labels{position:absolute;inset:60px 0 0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);pointer-events:none}.label{text-align:center;padding-top:8px;font-size:15px}.label small{display:block;font-size:10px;color:#b0c0cc}canvas{position:absolute;top:60px}</style><script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js"}}</script></head><body><h1>Wrath character import · skeleton and animation check</h1><div id="labels"></div><script type="module">
import * as T from 'three';import{loadCharacters,createCharacter}from'/src/characters.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight-60);document.body.append(renderer.domElement);const entries=await loadCharacters();const actors=entries.map(e=>{const a=createCharacter(e.id);const scene=new T.Scene();scene.background=new T.Color(e.faction==='alliance'?0x172c3d:e.faction==='horde'?0x39241f:0x203029);scene.add(a.root);scene.add(new T.HemisphereLight(0xffffff,0x646464,3));const light=new T.DirectionalLight(0xffffff,2);light.position.set(3,5,5);scene.add(light);const cam=new T.PerspectiveCamera(35,innerWidth/4/((innerHeight-60)/3),.1,20);cam.position.set(1.5,1.3,4.9);cam.lookAt(0,1.1,0);document.getElementById('labels').insertAdjacentHTML('beforeend',`<div class="label">${e.name}<small>${e.faction.toUpperCase()} · ${e.clips.join(' / ')}</small></div>`);return{a,scene,cam};});document.getElementById('labels').style.zIndex=2;window.gallery={actors};let last=performance.now();function frame(t){requestAnimationFrame(frame);const dt=Math.min((t-last)/1000,.05);last=t;renderer.setScissorTest(true);actors.forEach(({a,scene,cam},i)=>{a.update(dt);const w=innerWidth/4,h=(innerHeight-60)/3,x=(i%4)*w,y=(2-Math.floor(i/4))*h;renderer.setViewport(x,y,w,h);renderer.setScissor(x,y,w,h);renderer.render(scene,cam);});}requestAnimationFrame(frame);document.documentElement.dataset.ready='true';
</script></body></html>
